<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALABIBAS | Admin – Customer Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Poppins", Arial, sans-serif;
    color: #000;
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  a { color: inherit; text-decoration: none; }
  button, input { font-family: inherit; }

  /* ---------- Header ---------- */
  header {
    background: #f8f0de;
    padding: 12px 24px;
    box-shadow: 0 2px 3px rgba(0, 0, 0, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex: none;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { max-height: 40px; width: auto; display: block; }
  .brand span { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

  .who { display: flex; align-items: center; gap: 14px; font-size: 0.78rem; }
  .who a:hover { text-decoration: underline; }

  .logout {
    background: #a36233;
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 7px 18px;
    font-size: 0.78rem;
    cursor: pointer;
  }

  .logout:hover { background: #8a5630; }

  /* ---------- Inbox ---------- */
  main { flex: 1; min-height: 0; padding: 20px; }

  .inbox {
    max-width: 1100px;
    height: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 320px 1fr;
    background: #b0b998;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  }

  /* left: conversations */
  .list-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid rgba(0, 0, 0, 0.15);
  }

  .list-pane h2 { font-size: 1rem; font-weight: 600; padding: 16px 18px 12px; }

  .convs { flex: 1; overflow-y: auto; list-style: none; }

  .conv {
    width: 100%;
    display: block;
    text-align: left;
    background: none;
    border: 0;
    border-top: 1px solid rgba(0, 0, 0, 0.12);
    padding: 12px 18px;
    cursor: pointer;
    position: relative;
  }

  .conv:hover { background: rgba(255, 255, 255, 0.3); }
  .conv.selected { background: #f8f0de; }
  .conv .top { display: flex; justify-content: space-between; gap: 8px; }
  .conv .name { font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .time { font-size: 0.65rem; color: #333; flex: none; }
  .conv .preview { font-size: 0.75rem; color: #222; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 26px; }

  .conv .unread {
    position: absolute;
    right: 16px;
    bottom: 12px;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: #b3261e;
    color: #fff;
    font-size: 0.68rem;
    font-weight: 600;
    line-height: 20px;
    text-align: center;
  }

  .empty-list { padding: 24px 18px; font-size: 0.82rem; line-height: 1.6; }

  /* right: conversation */
  .chat-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
    background: #fff;
  }

  .chat-head {
    background: #f8f0de;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid #eee6d3;
  }

  .chat-head .info { min-width: 0; }
  .chat-head strong { display: block; font-size: 0.95rem; font-weight: 600; }
  .chat-head small { font-size: 0.72rem; color: #444; }

  .head-actions { display: flex; align-items: center; gap: 10px; }

  .back-btn { display: none; background: none; border: 0; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }

  .delete-btn {
    background: none;
    border: 1px solid #a36233;
    color: #a36233;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.72rem;
    cursor: pointer;
  }

  .delete-btn:hover { background: #a36233; color: #fff; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    background: #fbf8f1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row { display: flex; flex-direction: column; max-width: 75%; }
  .row.admin { align-self: flex-end; align-items: flex-end; }
  .row.user  { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 9px 14px;
    border-radius: 14px;
    font-size: 0.85rem;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .row.admin .bubble { background: #a36233; color: #fff; border-bottom-right-radius: 4px; }
  .row.user .bubble  { background: #f8f0de; border-bottom-left-radius: 4px; }
  .row .stamp { font-size: 0.62rem; color: #777; margin-top: 2px; }

  .placeholder { margin: auto; text-align: center; color: #555; font-size: 0.9rem; padding: 0 20px; line-height: 1.6; }

  .reply-form { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid #eee6d3; background: #fff; }
  .reply-form[hidden] { display: none; }

  .reply-form input {
    flex: 1;
    min-width: 0;
    height: 42px;
    border: 1px solid #b0b998;
    border-radius: 999px;
    padding: 0 16px;
    font-size: 0.88rem;
    outline: none;
  }

  .reply-form input:focus { border-color: #a36233; }

  .reply-form button {
    border: 0;
    border-radius: 999px;
    background: #a36233;
    color: #fff;
    padding: 0 24px;
    font-size: 0.88rem;
    cursor: pointer;
  }

  .reply-form button:hover { background: #8a5630; }

  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid #000; outline-offset: 2px; }

  /* ---------- Small screens ---------- */
  @media (max-width: 760px) {
    header { padding: 10px 14px; }
    main { padding: 10px; }
    .inbox { grid-template-columns: 1fr; }
    .inbox .chat-pane { display: none; }
    .inbox.chat-open .list-pane { display: none; }
    .inbox.chat-open .chat-pane { display: flex; }
    .back-btn { display: inline; }
    .row { max-width: 88%; }
  }
</style>
</head>

<body>

<header>
  <div class="brand">
    <a href="index.html"><img src="images/logo.png" alt="ALABIBAS"></a>
    <span>Admin</span>
  </div>
  <div class="who">
    <span id="adminName"></span>
    <a href="index.html">View store</a>
    <button class="logout" id="logoutBtn" type="button">Log out</button>
  </div>
</header>

<main>
  <div class="inbox" id="inbox">

    <section class="list-pane" aria-label="Conversations">
      <h2>Customer messages</h2>
      <ul class="convs" id="convs"></ul>
    </section>

    <section class="chat-pane" aria-label="Conversation">
      <div class="chat-head" id="chatHead" hidden>
        <div class="info">
          <strong id="custName"></strong>
          <small id="custEmail"></small>
        </div>
        <div class="head-actions">
          <button class="back-btn" id="backBtn" type="button">&larr; All chats</button>
          <button class="delete-btn" id="deleteBtn" type="button">Delete chat</button>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite">
        <p class="placeholder">Select a conversation on the left to read and reply.</p>
      </div>

      <form class="reply-form" id="replyForm" hidden>
        <input type="text" id="replyInput" maxlength="500" placeholder="Type your reply..." aria-label="Your reply" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </section>

  </div>
</main>

<script>
  /*
    NOTE: front-end demo. Conversations live in this browser's localStorage
    (key "alabibasChats"), the same place chat.js writes customer messages,
    so the customer and the admin must use the same browser (e.g. two tabs).
    The admin check below is NOT real security: anyone can edit localStorage.
    For a real store, check the admin on a server (PHP + MySQL) and keep the
    chats in a database. Replace getChats() / saveChats() when you do.
  */
  var ADMIN_KEY = "alabibasAdmin";
  var CHATS_KEY = "alabibasChats";
  var MAX_LEN   = 500;
  var MAX_MSGS  = 200;

  function read(key) {
    try { return JSON.parse(localStorage.getItem(key)); }
    catch (e) { return null; }
  }

  function getChats() {
    var c = read(CHATS_KEY);
    return c && typeof c === "object" ? c : {};
  }

  function saveChats(chats) {
    try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); return true; }
    catch (e) { return false; }
  }

  // ----- only admins may be here -----
  var admin = read(ADMIN_KEY);
  if (!admin) {
    location.replace("login.html");
  }

  var inbox     = document.getElementById("inbox");
  var convsEl   = document.getElementById("convs");
  var chatHead  = document.getElementById("chatHead");
  var custName  = document.getElementById("custName");
  var custEmail = document.getElementById("custEmail");
  var messagesEl = document.getElementById("messages");
  var replyForm = document.getElementById("replyForm");
  var replyInput = document.getElementById("replyInput");

  var selected = null;       // email of the open conversation

  if (admin) document.getElementById("adminName").textContent = "Signed in as " + (admin.name || admin.email);

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    var h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + ":" + (m < 10 ? "0" : "") + m + " " + ap;
  }

  function fmtStamp(ts) {
    var d = new Date(ts);
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    return sameDay ? fmtTime(ts) : d.toLocaleDateString("en-PH", { month: "short", day: "numeric" }) + ", " + fmtTime(ts);
  }

  function unreadCount(conv) {
    var seen = conv.adminSeen || 0, n = 0;
    conv.messages.forEach(function (m) { if (m.from === "user" && m.ts > seen) n++; });
    return n;
  }

  function markSeen(email) {
    var chats = getChats();
    var conv = chats[email];
    if (!conv || unreadCount(conv) === 0) return;
    conv.adminSeen = Date.now();
    saveChats(chats);
  }

  // ----- conversation list -----
  function renderList() {
    var chats = getChats();
    var emails = Object.keys(chats).filter(function (e) {
      return chats[e] && chats[e].messages && chats[e].messages.length;
    });

    emails.sort(function (a, b) {
      var la = chats[a].messages[chats[a].messages.length - 1].ts;
      var lb = chats[b].messages[chats[b].messages.length - 1].ts;
      return lb - la;
    });

    convsEl.innerHTML = "";

    if (emails.length === 0) {
      var li = el("li", "empty-list", "No messages yet. When a customer writes to you from the chat box, the conversation will appear here.");
      convsEl.appendChild(li);
      return;
    }

    emails.forEach(function (email) {
      var conv = chats[email];
      var last = conv.messages[conv.messages.length - 1];
      var unread = unreadCount(conv);

      var li = el("li");
      var b = el("button", "conv" + (email === selected ? " selected" : ""));
      b.type = "button";

      var top = el("div", "top");
      top.appendChild(el("span", "name", conv.name || email));
      top.appendChild(el("span", "time", fmtStamp(last.ts)));
      b.appendChild(top);
      b.appendChild(el("div", "preview", (last.from === "admin" ? "You: " : "") + last.text));
      if (unread && email !== selected) b.appendChild(el("span", "unread", unread > 9 ? "9+" : String(unread)));

      b.addEventListener("click", function () { openConv(email); });
      li.appendChild(b);
      convsEl.appendChild(li);
    });
  }

  // ----- open conversation -----
  function renderMessages(stickToBottom) {
    var conv = selected ? getChats()[selected] : null;

    if (!conv) {
      selected = null;
      chatHead.hidden = true;
      replyForm.hidden = true;
      inbox.classList.remove("chat-open");
      messagesEl.innerHTML = "";
      messagesEl.appendChild(el("p", "placeholder", "Select a conversation on the left to read and reply."));
      return;
    }

    var nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 60;

    chatHead.hidden = false;
    replyForm.hidden = false;
    custName.textContent = conv.name || selected;
    custEmail.textContent = selected;

    messagesEl.innerHTML = "";
    conv.messages.forEach(function (m) {
      var row = el("div", "row " + (m.from === "admin" ? "admin" : "user"));
      row.appendChild(el("div", "bubble", m.text));      // textContent: safe from HTML injection
      row.appendChild(el("span", "stamp", fmtStamp(m.ts) + (m.from === "admin" && m.by ? " \u00b7 " + m.by : "")));
      messagesEl.appendChild(row);
    });

    if (stickToBottom || nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function openConv(email) {
    selected = email;
    markSeen(email);
    inbox.classList.add("chat-open");
    renderList();
    renderMessages(true);
    replyInput.focus();
  }

  // ----- reply -----
  replyForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = replyInput.value.trim().slice(0, MAX_LEN);
    if (!selected || !text) return;

    var chats = getChats();
    var conv = chats[selected];
    if (!conv) return;

    conv.messages.push({ from: "admin", text: text, ts: Date.now(), by: (admin && (admin.name || admin.email)) || "Admin" });
    if (conv.messages.length > MAX_MSGS) conv.messages = conv.messages.slice(-MAX_MSGS);
    conv.adminSeen = Date.now();

    if (!saveChats(chats)) {
      alert("Your browser blocked saving the reply. Please check its storage settings.");
      return;
    }
    replyInput.value = "";
    renderList();
    renderMessages(true);
  });

  document.getElementById("deleteBtn").addEventListener("click", function () {
    if (!selected) return;
    if (!confirm("Delete this whole conversation? This cannot be undone.")) return;
    var chats = getChats();
    delete chats[selected];
    saveChats(chats);
    selected = null;
    renderList();
    renderMessages(true);
  });

  document.getElementById("backBtn").addEventListener("click", function () {
    inbox.classList.remove("chat-open");
    selected = null;
    renderList();
    renderMessages(true);
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    try { localStorage.removeItem(ADMIN_KEY); } catch (e) {}
    location.href = "login.html";
  });

  // ----- live updates: other tab (storage event) + a light timer -----
  var lastSig = "";

  function signature() {
    var chats = getChats();
    return Object.keys(chats).map(function (e) {
      var m = chats[e].messages || [];
      return e + ":" + m.length + ":" + (m.length ? m[m.length - 1].ts : 0) + ":" + (chats[e].adminSeen || 0);
    }).join("|") + "#" + selected;
  }

  function refresh() {
    if (!admin) return;
    if (selected) markSeen(selected);       // keep the open chat marked as read
    var sig = signature();
    if (sig === lastSig) return;
    lastSig = sig;
    renderList();
    renderMessages(false);
  }

  window.addEventListener("storage", function (e) {
    if (e.key === CHATS_KEY || e.key === ADMIN_KEY || e.key === null) {
      if (!read(ADMIN_KEY)) { location.replace("login.html"); return; }
      refresh();
    }
  });
  setInterval(refresh, 2000);

  if (admin) { renderList(); renderMessages(true); lastSig = signature(); }
</script>

</body>
</html>
